name: Extract Android Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Find and extract ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          ROOT=$(find extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)

          if [ -n "$ROOT" ]; then
            cp -a "$ROOT/app" .
            cp -a "$ROOT/build.gradle" .
            cp -a "$ROOT/gradle.properties" .
            cp -a "$ROOT/settings.gradle" .
            cp -a "$ROOT/README.md" .
          else
            cp -a extracted/app .
            cp -a extracted/build.gradle .
            cp -a extracted/gradle.properties .
            cp -a extracted/settings.gradle .
            cp -a extracted/README.md .
          fi

          rm -rf extracted
          rm -f "$ZIP_FILE"

      - name: Commit extracted project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Extract Android project"
            git push
          fi
